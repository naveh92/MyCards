plugins {
    id 'com.android.application'
}

// Signing credentials are read from an untracked file rather than hardcoded here, so the
// build script stays safe to publish. A clone without the file still builds and tests —
// only `assembleRelease`/`bundleRelease` produce an unsigned artifact, which fails loudly
// at upload rather than quietly shipping something signed with a debug key.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    // The Java package and R class. Deliberately left as com.mycards even though the
    // applicationId below differs: namespace is a compile-time concern and renaming it
    // would move every source file for no benefit.
    namespace 'com.mycards'
    // API 36. Play requires new submissions to target this from 31 August 2026, and an app
    // uploaded at 35 would need re-releasing within weeks. Verified on an Android 16 device:
    // the edge-to-edge enforcement this brings is already handled in EdgeToEdge.
    compileSdk 36

    // Pinned to a version already present in the local SDK. Left unset, AGP tries to
    // download the build-tools it prefers, which fails behind a TLS-inspecting proxy.
    buildToolsVersion '36.0.0'

    defaultConfig {
        // The identity Play knows the app by, and permanent once published — it can never
        // be changed or reused afterwards. "com.mycards" was already taken on Play, so this
        // is derived from naveh92.github.io, a domain actually under our control, which is
        // what the reverse-domain convention is for and guarantees nobody else holds it.
        applicationId "io.github.naveh92.mycards"
        minSdk 26
        targetSdk 36
        // Play burns a version code permanently on first upload, across every track and
        // even for a draft that is never published, so a rejected or replaced bundle still
        // consumes one. Increment this for every upload; it can never be reused or lowered.
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Hebrew ships as 'iw' on Android (legacy ISO code) — see res/values-iw.
        resourceConfigurations += ['en', 'iw']

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        // Exposes the exported Room schemas to MigrationTest, which replays a real v1
        // database through the migration instead of trusting it by inspection.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'

    // Background sync
    implementation 'androidx.work:work-runtime:2.9.1'

    // Biometric gate for revealing card numbers
    implementation 'androidx.biometric:biometric:1.1.0'

    // Networking + JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
