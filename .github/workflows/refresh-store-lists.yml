name: Refresh store lists

# Publishes the merchant lists that every install reads.
#
# This runs here rather than in a "moderator" build of the app on purpose: writing to the
# repo needs a credential, and anything shipped inside an APK can be decompiled out of it.
# Keeping the publisher in CI means the app has no write path at all — it only ever makes
# anonymous GET requests — and it also means BuyMe sees one runner per week instead of one
# request per user per week.

on:
  schedule:
    # Weekly, early Monday UTC. Merchant lists change slowly; this is not urgent work.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was triggered by hand'
        required: false

permissions:
  contents: write
  # So a broken upstream source can file an issue rather than failing quietly in a tab
  # nobody looks at.
  issues: write

concurrency:
  group: refresh-store-lists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the upstream source is still healthy
        run: bash tools/check-sources.sh

      - name: Fetch supplier payloads
        run: |
          mkdir -p .work/raw
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
          while read -r id _; do
            [ -z "$id" ] && continue
            case "$id" in \#*) continue ;; esac
            curl -sS --fail --max-time 180 -H "User-Agent: $UA" \
              "https://buyme.co.il/siteapi/brands/$id" -o ".work/raw/$id.json"
          done < tools/suppliers.txt

      - name: Regenerate catalog and store lists
        run: |
          mkdir -p .work/publish/stores
          curl -sSL -o .work/gson.jar \
            https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar
          javac -encoding UTF-8 -cp .work/gson.jar -d .work/classes tools/CatalogGen.java
          # The ":true" flag in supplier-args.txt marks which snapshots are bundled into
          # the APK — a size decision. Everything gets *published*, so force the flag on
          # for every entry here. Without this only the bundled few are written, and the
          # rsync --delete below then removes every other list from the site.
          ARGS=$(grep -v '^#' tools/supplier-args.txt | sed 's/:true$//' | sed 's/$/:true/' | tr '\n' ' ')
          java -Dfile.encoding=UTF-8 -cp ".work/classes:.work/gson.jar" CatalogGen \
            .work/publish/stores .work/raw $ARGS > .work/entries.json

          echo "generated $(ls .work/publish/stores | wc -l) store lists"
          # Every list is published; the APK still bundles only the largest few.
          cp app/src/main/assets/catalog.json .work/publish/catalog.json

      - name: Regenerate the HTZone lists
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          javac -encoding UTF-8 -cp .work/gson.jar -d .work/classes tools/HtZoneGen.java
          grep -v '^#' tools/htzone-pages.txt | while IFS=: read -r id slug; do
            [ -z "$id" ] && continue
            curl -sS --fail --max-time 180 -H "User-Agent: $UA" \
              "https://www.htzone.co.il/voucher-zone/$id" -o ".work/raw/zone-$id.html"
            java -Dfile.encoding=UTF-8 -cp ".work/classes:.work/gson.jar" HtZoneGen \
              ".work/publish/stores/$slug.json" "$slug" ".work/raw/zone-$id.html"
          done

      - name: Keep the hand-maintained lists
        run: |
          # love_gift_card is transcribed from the issuer's published terms rather than
          # scraped, so it is copied through instead of regenerated.
          cp app/src/main/assets/stores/love_gift_card.json .work/publish/stores/ || true

      - name: Write the manifest
        run: bash tools/gen-manifest.sh .work/publish

      - name: Publish into the docs/ directory served by GitHub Pages
        run: |
          # Guard the --delete: if generation went wrong and produced far fewer lists than
          # are already published, stop rather than wiping the site. A refresh should never
          # be able to remove data by failing quietly.
          generated=$(ls .work/publish/stores/*.json 2>/dev/null | wc -l)
          existing=$(ls docs/stores/*.json 2>/dev/null | wc -l)
          if [ "$existing" -gt 0 ] && [ "$generated" -lt "$existing" ]; then
            echo "Refusing to publish: generated $generated lists but $existing are live."
            exit 1
          fi
          mkdir -p docs
          rsync -a --delete .work/publish/ docs/

      - name: Commit only if a store list actually changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          # The manifest's generatedAt changes on every run, so committing unconditionally
          # would create a pointless commit each week and make every phone re-download.
          # Only a real change to the lists or the catalog is worth publishing.
          if git diff --cached --quiet -- docs/stores docs/catalog.json; then
            echo "No store list changed; skipping commit."
            git reset
            exit 0
          fi
          git commit -m "Refresh store lists $(date -u +%Y-%m-%d)"
          git push

      # Runs whatever went wrong above: a changed upstream source, a failed download, or
      # the guard refusing to publish a shrunken set.
      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Store list refresh is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly store list refresh failed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Users are not broken by this. The app falls back to the last published"
            echo "lists, then to the snapshots compiled into the APK, so it keeps working on"
            echo "older data. What is lost is freshness, until the source is repaired."
            echo
            echo "Likely causes, cheapest first:"
            echo
            echo "- A transient network failure. The canary retries three times before"
            echo "  giving up, so this is unlikely, but re-running the job rules it out."
            echo "- An endpoint moved or changed its JSON shape. That is a catalog edit:"
            echo "  generic_json and embedded_json take their paths from configuration, so"
            echo "  no app release is needed."
            echo "- A source stopped serving machine-readable data. That needs a new"
            echo "  provider in the app, and users stay on bundled data until it ships."
            echo
            echo "This issue closes itself when a refresh next succeeds."
          } > /tmp/failure-body.md

          # Reuse one issue rather than filing a fresh one weekly. A pile of identical
          # issues is just a slower way of being ignored.
          EXISTING=$(gh issue list --state all --limit 50 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")

          if [ -n "$EXISTING" ]; then
            gh issue reopen "$EXISTING" || true
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body-file /tmp/failure-body.md
          fi

      - name: Close the failure issue once a refresh succeeds
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Store list refresh is failing
        run: |
          NUM=$(gh issue list --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "A refresh succeeded; the sources are healthy again."
            gh issue close "$NUM"
          fi
